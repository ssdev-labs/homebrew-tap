name: Publish casks

on:
  repository_dispatch:
    types:
      - publish-casks

permissions:
  contents: write

concurrency:
  group: homebrew-tap-casks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::repository_dispatch payload must include a release tag"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release-casks"
          gh release download "$RELEASE_TAG" \
            --pattern '*.rb' \
            --dir "$RUNNER_TEMP/release-casks"
          if ! compgen -G "$RUNNER_TEMP/release-casks/*.rb" >/dev/null; then
            echo "::error::release $RELEASE_TAG does not contain a cask"
            exit 1
          fi
      - name: Update Homebrew
        run: brew update
      - name: Format and audit casks
        run: |
          brew tap-new yahuo/release-validation
          validation_tap="$(brew --repo yahuo/release-validation)"
          mkdir -p "$validation_tap/Casks" Casks
          for cask in "$RUNNER_TEMP"/release-casks/*.rb; do
            token="$(basename "$cask" .rb)"
            cp "$cask" "$validation_tap/Casks/$token.rb"
            brew style --fix --cask "yahuo/release-validation/$token"
            brew style --cask "yahuo/release-validation/$token"
            brew audit --cask --strict "yahuo/release-validation/$token"
            cp "$validation_tap/Casks/$token.rb" "Casks/$token.rb"
          done
      - name: Commit casks
        run: |
          git add Casks
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "yahuo tap release bot"
          git config user.email "actions@github.com"
          git commit -m "tap: publish $RELEASE_TAG"
          git push origin master
