name: Publish casks

on:
  repository_dispatch:
    types:
      - publish-casks

permissions:
  contents: write

concurrency:
  group: homebrew-tap-casks
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.client_payload.tag }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download generated package files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "::error::repository_dispatch payload must include a release tag"
            exit 1
          fi
          patterns=(--pattern '*.rb')
          if [[ "$RELEASE_TAG" == ssdev-cairn-v* ]]; then
            patterns+=(--pattern 'install.ps1' --pattern 'install.sh')
          fi
          mkdir -p "$RUNNER_TEMP/release-files"
          gh release download "$RELEASE_TAG" \
            "${patterns[@]}" \
            --dir "$RUNNER_TEMP/release-files"
          if ! compgen -G "$RUNNER_TEMP/release-files/*.rb" >/dev/null; then
            echo "::error::release $RELEASE_TAG does not contain a cask"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == ssdev-cairn-v* ]] &&
            [[ ! -f "$RUNNER_TEMP/release-files/install.ps1" ]]; then
            echo "::error::release $RELEASE_TAG does not contain install.ps1"
            exit 1
          fi
          if [[ "$RELEASE_TAG" == ssdev-cairn-v* ]] &&
            [[ ! -f "$RUNNER_TEMP/release-files/install.sh" ]]; then
            echo "::error::release $RELEASE_TAG does not contain install.sh"
            exit 1
          fi
      - name: Update Homebrew
        run: brew update
      - name: Format and audit casks
        run: |
          brew tap-new ssdev-labs/release-validation
          validation_tap="$(brew --repo ssdev-labs/release-validation)"
          mkdir -p "$validation_tap/Casks" Casks
          for cask in "$RUNNER_TEMP"/release-files/*.rb; do
            token="$(basename "$cask" .rb)"
            cp "$cask" "$validation_tap/Casks/$token.rb"
            brew style --fix --cask "ssdev-labs/release-validation/$token"
            brew style --cask "ssdev-labs/release-validation/$token"
            brew audit --cask --strict "ssdev-labs/release-validation/$token"
            cp "$validation_tap/Casks/$token.rb" "Casks/$token.rb"
          done
      - name: Update public installers
        run: |
          if [[ "$RELEASE_TAG" == ssdev-cairn-v* ]]; then
            for installer in install.ps1 install.sh; do
              if grep -Fq '__SSDEV_CAIRN_VERSION__' "$RUNNER_TEMP/release-files/$installer"; then
                echo "::error::$installer still contains its version placeholder"
                exit 1
              fi
              cp "$RUNNER_TEMP/release-files/$installer" "$installer"
            done
            sh -n install.sh
          fi
      - name: Commit package files
        run: |
          git add Casks install.ps1 install.sh
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "ssdev-labs tap release bot"
          git config user.email "actions@github.com"
          git commit -m "chore(tap): 发布 $RELEASE_TAG"
          git push origin master
